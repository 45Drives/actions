name: 'Prebuild Package Flow'
description: 'Run the prebuild steps'
inputs:
  directory:
    description: 'The base directory of the project'
    required: true
outputs:
  manifest:
    description: "Manifest json content"
    value: ${{ steps.manifest.outputs.json }}
  matrix:
    description: "Matrix json content"
    value: ${{ steps.manifest.outputs.matrix }}
  uuid:
    description: "UUID of Job"
    value: ${{ steps.manifest.outputs.uuid }}
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0 # required to fetch main
    - id: check_merged_main
      name: Check if tag is merged into ${{ github.event.repository.default_branch }}
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        if ! git merge-base --is-ancestor ${{ github.ref }} origin/${{ github.event.repository.default_branch }}; then
          echo "This tag is not merged into ${{ github.event.repository.default_branch }}. Aborting build."
          exit 1
        fi
      shell: bash
    - id: manifest
      name: Get manifest json
      uses: 45drives/actions/get-manifest@main
      with:
        path: ${{ inputs.directory }}/manifest.json

    - name: generate-ansible-vars
      run: /root/git/auto-packaging/new-scripts/generate-ansible-vars ${{ inputs.directory }} ${{ steps.manifest.outputs.uuid }} ${{ fromJson(steps.manifest.outputs.json).stable }}
      shell: bash

    - name: where are we
      run: echo "${{ inputs.directory }} ${{ steps.manifest.outputs.uuid }} ${{ fromJson(steps.manifest.outputs.json).stable }}" 
      shell: bash

    - name: Run prebuild playbook
      uses: 45drives/actions/ansible-playbook@main
      with:
        playbook: /root/git/auto-packaging/actions/ansible/prebuild.yml
        directory: ${{ inputs.directory }}/packaging
        group_vars_directory: ${{ inputs.directory }}/packaging/group_vars
        inventory: |
          [ci]
          localhost
        become: true
        host_key_checking: true
